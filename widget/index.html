<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malibu · Embed</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/src/brand.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #101D29; color: #FAFBFF; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    .wrap { display: flex; flex-direction: column; height: 100%; }
    .head { padding: 12px 16px; border-bottom: 1px solid rgba(255,251,242,0.08); display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .head a { color: #FFC629; text-decoration: none; margin-left: auto; font-size: 12px; }
    .stream { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { margin-bottom: 12px; font-size: 14px; line-height: 1.55; }
    .msg.user { color: #FAFBFF; }
    .msg.ai { color: rgba(255,251,242,0.88); }
    .composer { padding: 12px 16px 16px; border-top: 1px solid rgba(255,251,242,0.08); display: flex; gap: 8px; }
    .composer input { flex: 1; padding: 10px 12px; background: #0C3A45; border: 1px solid rgba(255,251,242,0.12); border-radius: 10px; color: #FAFBFF; font: inherit; }
    .composer button { padding: 10px 14px; background: #F76B57; color: #FAFBFF; border: 0; border-radius: 10px; font: inherit; font-weight: 500; cursor: pointer; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,198,41,0.8); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <strong class="brand-wordmark">Malibu<span class="brand-period brand-period--square" aria-hidden="true"></span></strong>
      <span class="badge">demo embed</span>
      <a href="/console/" target="_blank" rel="noopener">Open full console →</a>
    </div>
    <div class="stream" data-stream></div>
    <form class="composer" data-form>
      <input data-input placeholder="Ask anything…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script type="module" src="./widget.js"></script>
</body>
</html>
