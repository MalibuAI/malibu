<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Malibu · Signing in…</title>
  <link rel="stylesheet" href="/console/console.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      color: #fffbf2;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    .panel {
      width: min(420px, calc(100vw - 32px));
      padding: 28px 24px;
      border: 1px solid rgba(250, 251, 255, 0.12);
      border-radius: 14px;
      background: rgba(250, 251, 255, 0.03);
      text-align: center;
    }
    .panel h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 500;
    }
    .panel p {
      margin: 0;
      color: rgba(250, 251, 255, 0.62);
      line-height: 1.5;
    }
    .panel.err p { color: #ffb4a8; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 2px solid rgba(250, 251, 255, 0.18);
      border-top-color: #ffc629;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      margin-top: 18px;
      border: 1px solid rgba(250, 251, 255, 0.18);
      background: rgba(250, 251, 255, 0.06);
      color: #fffbf2;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="panel" data-panel>
    <div class="spinner" data-spinner aria-hidden="true"></div>
    <h1>Signing in…</h1>
    <p>Finishing GitHub sign-in and saving your API key.</p>
  </div>
  <script type="module">
    import { exchangeHandoff, saveKey } from '../api.js';

    const panel = document.querySelector('[data-panel]');
    const spinner = document.querySelector('[data-spinner]');

    function fail(message) {
      panel.classList.add('err');
      spinner?.remove();
      panel.innerHTML = `
        <h1>Sign-in failed</h1>
        <p>${message}</p>
        <button class="btn" type="button" data-retry>Try again</button>`;
      panel.querySelector('[data-retry]')?.addEventListener('click', () => {
        location.replace('/console/?auth=retry');
      });
    }

    const params = new URLSearchParams(location.search);
    const handoff = params.get('handoff');
    const error = params.get('error');

    if (error === 'no_key') {
      fail('Your GitHub account is linked but no API key was issued. Try again from Malibu.');
    } else if (!handoff) {
      fail('Missing sign-in token. Start again from Malibu.');
    } else {
      try {
        const { api_key: apiKey } = await exchangeHandoff(handoff);
        if (!apiKey || !saveKey(apiKey)) {
          throw new Error('Could not save API key in this browser.');
        }
        location.replace('/console/?auth=connected');
      } catch (e) {
        fail(e?.message || 'Could not complete sign-in.');
      }
    }
  </script>
</body>
</html>
