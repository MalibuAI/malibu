# Independent liveness heartbeat for the blog content drip.
#
# The drip only signals when it runs. This weekly check catches the one failure
# the drip cannot report itself: the workflow silently not running at all
# (schedule disabled, repo actions paused, a bad edit that won't parse). It asks
# the Actions API for the drip's last completed run and alerts on Telegram if
# it's stale. Stateless — the run history is the source of truth, no persisted
# state to drift.
#
# Quiet by design when: ANTHROPIC_API_KEY is unset (drip is intentionally
# dormant — the drip's own preflight reports that), or there are no completed
# runs yet (fresh setup). It only fires when a drip that WAS running goes stale.

name: Blog drip liveness

on:
  schedule:
    # Mon + Thu 15:00 UTC (before the drip's 16:00 run), so total-staleness is
    # caught within a few days, not up to ~10.
    - cron: "0 15 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read # actions/checkout needs this on a PRIVATE repo — without it the job 403s
  actions: read # gh run list

concurrency:
  group: blog-drip-liveness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check drip liveness
        env:
          # github.token carries actions:read here; DRIP_PAT (contents+PR write)
          # may lack the Actions scope and would 403 → silent "no runs".
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_AGE_DAYS: "6"
        run: |
          set -uo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "Drip is dormant by config (no ANTHROPIC_API_KEY) — no liveness alert."
            exit 0
          fi

          # (0) If the drip was DELIBERATELY disabled (our circuit breaker or an
          # operator), stay quiet — the AUTO-DISABLED alert already fired, and
          # re-alarming twice a week is exactly the fatigue we avoid. NOTE: only
          # `disabled_manually` is suppressed; `disabled_inactivity` (GitHub's
          # 60-day auto-disable) falls through to the recency alarm below.
          STATE=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/blog-drip.yml" --jq '.state' 2>/dev/null || echo "")
          echo "blog-drip.yml state: ${STATE:-unknown}"
          if [ "$STATE" = "disabled_manually" ]; then
            echo "Drip is disabled_manually (breaker or operator) — no liveness alarm."
            exit 0
          fi

          # Reset window: only look at runs since the workflow was last enabled/edited,
          # so a re-enable clears stale pre-disable history.
          SINCE=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/blog-drip.yml" --jq '.updated_at' 2>/dev/null | cut -dT -f1 || echo "")
          CREATED=""; [ -n "$SINCE" ] && CREATED="--created >=${SINCE}"

          # (1) Recency — is the SCHEDULED drip running at all? --event schedule so
          # a manual dispatch can't refresh this and mask a dead schedule.
          LAST=$(gh run list --workflow blog-drip.yml --event schedule --status completed ${CREATED} --limit 1 \
            --json createdAt --jq '.[0].createdAt // ""' 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            echo "No completed scheduled drip runs since ${SINCE:-setup} — nothing to check."
            exit 0
          fi
          NOW=$(date -u +%s)
          # Parse failure → treat as "now" (fresh) so a bad timestamp never false-alarms.
          LAST_TS=$(date -u -d "$LAST" +%s 2>/dev/null || { echo "WARN: could not parse '$LAST'; treating as fresh." >&2; echo "$NOW"; })
          AGE_DAYS=$(( (NOW - LAST_TS) / 86400 ))
          echo "Last completed scheduled run: ${LAST} (${AGE_DAYS} day(s) ago)."
          if [ "$AGE_DAYS" -ge "$MAX_AGE_DAYS" ]; then
            MSG="🚨 Malibu blog drip liveness: no completed scheduled run in ${AGE_DAYS} days (last ${LAST}). The schedule may be disabled or failing to start — check GitHub Actions."
            DRIP_OUTCOME=alert DRIP_ALERT_MSG="$MSG" node scripts/blog-drip-notify.mjs
            exit 0
          fi
          echo "Recency OK — within ${MAX_AGE_DAYS} days."

          # (2) Corroboration — is the drip RUNNING but failing every time? A second,
          # differently-scoped check that doesn't depend on the in-run streak step.
          CONC=$(gh run list --workflow blog-drip.yml --event schedule --status completed ${CREATED} --limit 3 \
            --json conclusion --jq '[.[].conclusion]' 2>/dev/null || echo '[]')
          ALLFAIL=$(node -e 'let a=[];try{a=JSON.parse(process.argv[1])}catch{}; process.stdout.write(a.length>=3 && a.every(c=>c==="failure")?"1":"0");' "$CONC")
          if [ "$ALLFAIL" = "1" ]; then
            MSG="🚨 Malibu blog drip liveness: the last 3 scheduled runs all FAILED. The drip is running but never producing — check GitHub Actions."
            DRIP_OUTCOME=alert DRIP_ALERT_MSG="$MSG" node scripts/blog-drip-notify.mjs
          else
            echo "Corroboration OK — last 3 scheduled runs are not all failures."
          fi
