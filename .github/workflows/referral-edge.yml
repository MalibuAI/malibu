name: Referral edge

on:
  pull_request:
    paths:
      - "edge/referral-worker/**"
      - ".github/workflows/referral-edge.yml"
  push:
    branches: [main]
    paths:
      - "edge/referral-worker/**"
      - ".github/workflows/referral-edge.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test edge/referral-worker/test/*.test.mjs
