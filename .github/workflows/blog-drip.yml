# Automated SEO blog "content drip" (PSEO Phase 3).
#
# Runs Claude Code on a schedule to draft ONE excellent post, then the workflow
# deterministically lints, builds (a gate), opens a DRAFT pull request (never
# merges), and notifies Telegram. Claude does the creative work only.
#
# STRUCTURE: a light `preflight` job checks the key (and sends the dormant alert),
# and the heavy `drip` job runs only when configured — so harden-runner, npm ci,
# and the paid Claude step never run on a dormant scheduled trigger. A separate
# blog-drip-liveness.yml weekly-checks that the drip is still running at all.
#
# SECURITY BOUNDARY:
#   - The Claude step receives ONLY anthropic_api_key. It is given NO GitHub
#     token, and checkout uses persist-credentials:false, so the model's Bash
#     has no credentials to push or open a PR. The deterministic "Assemble" step
#     authenticates separately to publish.
#   - The Telegram token is exposed only to the notify steps.
#   - Egress is MONITORED by harden-runner (audit mode) for tamper/exfil
#     visibility. RESIDUAL: the Claude step must hold ANTHROPIC_API_KEY and has
#     Bash + WebFetch over untrusted web content. MITIGATE: use a DEDICATED,
#     low-budget Anthropic key with billing alerts, and rotate on suspicion.
#
# REQUIRED repository secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY   dedicated low-budget Claude key
#   TELEGRAM_BOT_TOKEN  from @BotFather
#   TELEGRAM_CHAT_ID    the chat/channel to notify
# OPTIONAL:
#   DRIP_PAT            fine-grained PAT (contents+PR write) so CI runs on the
#                       drip's PRs (default GITHUB_TOKEN PRs don't trigger CI).
#
# Until ANTHROPIC_API_KEY is set, scheduled runs are a green no-op. First: set
# secrets → run manually with "test_notify" checked → a full manual run → then
# trust the schedule.

name: Blog content drip

on:
  schedule:
    # Mon / Wed / Fri at 16:00 UTC (~09:00 PT). Cron is UTC; adjust for DST.
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Only send a test Telegram message and exit (verifies wiring)"
        type: boolean
        default: false
      topic:
        description: "Optional topic hint for a manual run"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: blog-drip
  cancel-in-progress: false

jobs:
  # Fast path: verify Telegram secrets are wired without a full (paid) run.
  test-notify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notify }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIP_OUTCOME: skip
        run: |
          mkdir -p .drip
          printf '%s' '{"action":"skip","reason":"Telegram wiring test — ignore."}' > .drip/result.json
          node scripts/blog-drip-notify.mjs

  # Light gate: is the drip configured? Handles the dormant alert itself so the
  # expensive drip job is skipped entirely when there's no key.
  preflight:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notify) }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.pre.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight
        id: pre
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY not set — blog drip is dormant." >&2
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify dormant
        # Only when unconfigured: sends a "dormant" alert IF Telegram is set
        # (you started setup → the key is missing), silent otherwise (fresh repo).
        if: steps.pre.outputs.go == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIP_OUTCOME: dormant
        run: node scripts/blog-drip-notify.mjs

  drip:
    needs: preflight
    if: needs.preflight.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner (egress monitoring)
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
          disable-sudo: true
          # AUDIT (monitor), not BLOCK, is deliberate — NOT a shipped-disabled gap.
          # The routine's WebFetch research hits arbitrary primary-source domains a
          # static allowlist cannot enumerate, so block mode would break research.

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Model step gets no push credentials; the assemble step re-auths.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the content routine (Claude)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # NO github_token on purpose — the model must not be able to publish.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the Malibu blog content routine, running unattended in CI on
            the malibu.tech repository. Read and follow blog/drip-routine.md
            exactly — it defines your task, the quality bar, and the output
            contract (.drip/result.json). Obey blog/CLAUDE.md as the house style.
            Do NOT run git, open a pull request, or merge — you have no
            credentials to do so and the workflow handles publishing. Always
            finish by writing .drip/result.json.
            ${{ (github.event_name == 'workflow_dispatch' && inputs.topic != '') && format('Operator topic hint for this run: {0}. Prefer it if it clears the quality bar, and set "topic_hint_used" in .drip/result.json to true if you used it, false if you chose a different angle.', inputs.topic) || '' }}
          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch

      - name: Usage telemetry
        id: usage
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/blog-drip-usage.mjs "$EXEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Assemble draft PR
        id: assemble
        env:
          GH_TOKEN: ${{ secrets.DRIP_PAT || github.token }}
        run: |
          set -uo pipefail
          # Fail-closed: only the explicit success/skip paths overwrite this.
          echo "outcome=failed" >> "$GITHUB_OUTPUT"
          echo "runway=$(grep -cE '\| idea \|' blog/ideas.md 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

          if [ ! -f .drip/result.json ]; then echo "No .drip/result.json produced." >&2; exit 1; fi
          ACTION=$(node -e "process.stdout.write(String(require('./.drip/result.json').action||''))" 2>/dev/null) \
            || { echo "result.json is not valid JSON" >&2; exit 1; }
          echo "Routine action: ${ACTION}"

          if [ "$ACTION" = "skip" ]; then echo "outcome=skip" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ACTION" != "post" ]; then echo "Unknown action '${ACTION}'" >&2; exit 1; fi

          SLUG=$(node -e "process.stdout.write(String(require('./.drip/result.json').slug||''))")
          TITLE=$(node -e "process.stdout.write(String(require('./.drip/result.json').title||'Untitled draft'))")
          [ -n "$SLUG" ] || { echo "action=post but no slug" >&2; exit 1; }
          [ -f "blog/posts/${SLUG}.md" ] || { echo "post file blog/posts/${SLUG}.md missing" >&2; exit 1; }

          BRANCH="blog-drip/${SLUG}-${GITHUB_RUN_ID}"
          git check-ref-format --branch "$BRANCH" >/dev/null 2>&1 \
            || { echo "slug '${SLUG}' yields an invalid branch name" >&2; exit 1; }

          # Deterministic brand/house-style gate (CLAUDE.md §4/§5).
          node scripts/blog-lint.mjs "$SLUG" || { echo "blog-lint failed" >&2; exit 1; }

          # Build gate — a post that does not compile never opens a PR.
          npm run blog:build || { echo "blog:build failed" >&2; exit 1; }
          ./node_modules/.bin/vite build >/dev/null || { echo "vite build failed" >&2; exit 1; }

          # Flag any EXISTING post edited (e.g. a backward link) for extra review.
          ALSO=$(git status --porcelain blog/posts/ | awk '{print $2}' \
            | grep -v "^blog/posts/${SLUG}\.md$" | paste -sd, - || true)

          if [ ! -f ".drip/pr-body.md" ]; then
            printf '%s\n' "Automated blog draft: **${TITLE}**" > .drip/pr-body.md
          fi
          cat >> .drip/pr-body.md <<'CHECKLIST'

          ---
          **Reviewer checklist (blog/CLAUDE.md §5/§6):**
          - [ ] No `streamvc` / `MacProvider` / internal hostnames (auto-linted)
          - [ ] No invented or inflated network numbers — only `blog:stats` figures
          - [ ] No investment / yield / passive-income framing
          - [ ] Competitor claims cite a primary source
          - [ ] Reads like the manifesto; straight quotes; no AI-slop
          - [ ] Clears the §1 gate: real thesis, so-what, only-we angle
          CHECKLIST

          git config user.name "malibu-blog-drip"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "$BRANCH"
          git add blog/ public/
          git commit -m "Draft blog post: ${TITLE}" || { echo "nothing to commit" >&2; exit 1; }
          git push -u origin "$BRANCH" || { echo "push failed" >&2; exit 1; }

          PR_URL=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "Draft: ${TITLE}" --body-file .drip/pr-body.md) \
            || { echo "gh pr create failed" >&2; exit 1; }
          echo "Opened draft PR: ${PR_URL}"
          echo "outcome=post" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "also_edited=${ALSO}" >> "$GITHUB_OUTPUT"

      - name: Failure streak
        id: streak
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DRIP_PAT || github.token }}
        run: |
          set -uo pipefail
          # Count consecutive prior FAILED completed runs (escalation input).
          CONC=$(gh run list --workflow blog-drip.yml --status completed --limit 8 \
            --json conclusion --jq '[.[].conclusion]' 2>/dev/null || echo '[]')
          STREAK=$(node -e 'let a=[];try{a=JSON.parse(process.argv[1])}catch{}; let n=0; for(const c of a){ if(c==="failure") n++; else break; } process.stdout.write(String(n));' "$CONC")
          echo "prior_failures=${STREAK}" >> "$GITHUB_OUTPUT"

      - name: Salvage drafted post on failure
        id: salvage
        # Fires on an assemble failure AND on a Claude-step failure (assemble
        # skipped → outcome empty), i.e. anything that isn't a clean post/skip.
        if: always() && steps.assemble.outputs.outcome != 'post' && steps.assemble.outputs.outcome != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: blog-drip-salvage-${{ github.run_id }}
          path: |
            .drip/**
            blog/posts/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIP_OUTCOME: ${{ steps.assemble.outputs.outcome }}
          DRIP_PR_URL: ${{ steps.assemble.outputs.pr_url }}
          DRIP_ALSO_EDITED: ${{ steps.assemble.outputs.also_edited }}
          DRIP_RUNWAY: ${{ steps.assemble.outputs.runway }}
          DRIP_SALVAGE_URL: ${{ steps.salvage.outputs.artifact-url }}
          DRIP_COST: ${{ steps.usage.outputs.cost }}
          DRIP_TURNS: ${{ steps.usage.outputs.turns }}
          DRIP_DURATION: ${{ steps.usage.outputs.duration }}
          DRIP_PRIOR_FAILURES: ${{ steps.streak.outputs.prior_failures }}
          # Keep in sync with --max-turns and timeout-minutes above.
          DRIP_MAX_TURNS: "50"
          DRIP_TIMEOUT_S: "1800"
        run: node scripts/blog-drip-notify.mjs
