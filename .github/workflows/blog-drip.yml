# Automated SEO blog "content drip" (PSEO Phase 3).
#
# Runs Claude Code on a schedule to draft ONE excellent post, then the workflow
# deterministically builds the site, opens a DRAFT pull request (never merges),
# and notifies Telegram. Claude does the creative work only — git, the PR, and
# the Telegram token stay out of the model's hands.
#
# REQUIRED repository secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY   Claude API key (console.anthropic.com)
#   TELEGRAM_BOT_TOKEN  from @BotFather
#   TELEGRAM_CHAT_ID    the chat/channel to notify
# OPTIONAL:
#   DRIP_PAT            a fine-grained PAT (contents+PR write). Add this so CI
#                       (Vercel/build) runs on the drip's PRs — PRs opened with the
#                       default GITHUB_TOKEN do not trigger other workflows. Without
#                       it the draft PR is still created, just without auto-checks.
#
# First run: set the secrets, then trigger manually via the "Run workflow" button
# (workflow_dispatch) and watch the Actions log before trusting the schedule.

name: Blog content drip

on:
  schedule:
    # Mon / Wed / Fri at 16:00 UTC (~09:00 PT). Cron is UTC — it does not shift
    # for daylight saving; adjust the hour if you want a fixed local time.
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the content routine (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are the Malibu blog content routine, running unattended in CI on
            the malibu.tech repository. Read and follow blog/drip-routine.md
            exactly — it defines your entire task, the quality bar, and the output
            contract (.drip/result.json). Obey blog/CLAUDE.md as the house style.
            Do NOT run git, open a pull request, or merge — the workflow handles
            publishing. Always finish by writing .drip/result.json.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch

      - name: Assemble draft PR
        id: assemble
        env:
          GH_TOKEN: ${{ secrets.DRIP_PAT || github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .drip/result.json ]; then
            echo "No .drip/result.json produced by the routine." >&2
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACTION=$(node -e "process.stdout.write(String(require('./.drip/result.json').action||''))")
          echo "Routine action: ${ACTION}"
          if [ "$ACTION" != "post" ]; then
            echo "outcome=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUG=$(node -e "process.stdout.write(String(require('./.drip/result.json').slug||''))")
          TITLE=$(node -e "process.stdout.write(String(require('./.drip/result.json').title||'Untitled draft'))")
          if [ -z "$SLUG" ]; then echo "result.json action=post but no slug" >&2; echo "outcome=failed" >> "$GITHUB_OUTPUT"; exit 0; fi

          # Regenerate + gate: a broken post fails here, before any PR is opened.
          npm run blog:build
          npx vite build > /dev/null

          if [ ! -f ".drip/pr-body.md" ]; then
            printf '%s\n' "Automated blog draft: **${TITLE}**" "" "Generated by the blog content drip. Review against blog/CLAUDE.md before merging." > .drip/pr-body.md
          fi

          BRANCH="blog-drip/${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "malibu-blog-drip"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add blog/ public/
          git commit -m "Draft blog post: ${TITLE}"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "Draft: ${TITLE}" --body-file .drip/pr-body.md)
          echo "Opened draft PR: ${PR_URL}"
          echo "outcome=post" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIP_OUTCOME: ${{ steps.assemble.outputs.outcome }}
          DRIP_PR_URL: ${{ steps.assemble.outputs.pr_url }}
        run: node scripts/blog-drip-notify.mjs
