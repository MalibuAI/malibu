name: Build docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build-docs.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build-docs.mjs"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: cd docs && npx --yes mintlify@latest broken-links
      - name: Verify exported status page exists
        run: test -f dist/docs/status/index.html
